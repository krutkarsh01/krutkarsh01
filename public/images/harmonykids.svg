<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1067" width="800" height="1067">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182b"/>
      <stop offset="50%" stop-color="#1a1c38"/>
      <stop offset="100%" stop-color="#0e1322"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24284d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#181b36" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#ff7eb3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1067" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circular glows -->
  <circle cx="150" cy="200" r="160" fill="#ff7eb3" opacity="0.08" filter="url(#glow)"/>
  <circle cx="680" cy="500" r="200" fill="#4facfe" opacity="0.09" filter="url(#glow)"/>
  <circle cx="200" cy="850" r="180" fill="#43e97b" opacity="0.08" filter="url(#glow)"/>

  <!-- Top App Bar -->
  <g transform="translate(40, 50)">
    <rect width="720" height="74" rx="20" fill="url(#cardGrad)" stroke="#373b68" stroke-width="1.5"/>
    <text x="30" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#ffffff">🎵 Harmony Kids</text>
    <rect x="250" y="20" width="150" height="34" rx="17" fill="#2d335e"/>
    <text x="325" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffd166">⭐ 340 Stars</text>
    <rect x="420" y="20" width="130" height="34" rx="17" fill="#2d335e"/>
    <text x="485" y="43" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#43e97b">Level 3: Melody</text>
    <circle cx="675" cy="37" r="22" fill="url(#pinkGrad)"/>
    <text x="675" y="43" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#fff" font-weight="bold">👧</text>
  </g>

  <!-- Animal Tempo Game Header Card -->
  <g transform="translate(40, 150)">
    <rect width="720" height="190" rx="24" fill="url(#cardGrad)" stroke="#3b4175" stroke-width="1.5"/>
    <text x="35" y="48" font-family="sans-serif" font-size="14" font-weight="800" fill="#00f2fe" letter-spacing="2">ADAPTIVE AI TEMPO TRAINING</text>
    <text x="35" y="85" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Match the Rhythm with Friends</text>
    <text x="35" y="115" font-family="sans-serif" font-size="15" fill="#9da7cf">Sensory-inclusive audio cues and visual pulse feedback</text>

    <!-- Animal Tempo Avatars -->
    <g transform="translate(35, 130)">
      <!-- Turtle (Slow) -->
      <rect x="0" y="0" width="140" height="42" rx="12" fill="#293056" stroke="#4facfe" stroke-width="1.5"/>
      <text x="25" y="27" font-size="18">🐢</text>
      <text x="52" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Largo (60)</text>

      <!-- Rabbit (Fast - Active) -->
      <rect x="160" y="0" width="160" height="42" rx="12" fill="url(#pinkGrad)"/>
      <text x="185" y="27" font-size="18">🐰</text>
      <text x="212" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">Allegro (120) ✓</text>

      <!-- Lion (Steady) -->
      <rect x="340" y="0" width="140" height="42" rx="12" fill="#293056"/>
      <text x="365" y="27" font-size="18">🦁</text>
      <text x="392" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#9da7cf">Moderato</text>
    </g>
  </g>

  <!-- Interactive Piano Keyboard Card -->
  <g transform="translate(40, 365)">
    <rect width="720" height="340" rx="24" fill="url(#cardGrad)" stroke="#3b4175" stroke-width="1.5"/>
    <text x="35" y="48" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffd166" letter-spacing="2">PLAYABLE VIRTUAL INSTRUMENT</text>
    <text x="35" y="85" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">Interactive Touch Piano</text>
    
    <!-- Rhythm track waves -->
    <path d="M 380 65 Q 420 40 460 65 T 540 65 T 620 65 T 700 65" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="540" cy="65" r="7" fill="#ff7eb3"/>

    <!-- Piano Keys Container -->
    <g transform="translate(35, 115)">
      <!-- White Keys -->
      <rect x="0" y="0" width="88" height="195" rx="10" fill="#ffffff" stroke="#c4cbde" stroke-width="2"/>
      <text x="44" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#232742">C</text>
      <circle cx="44" cy="140" r="10" fill="#ff7eb3" opacity="0.3"/>

      <rect x="94" y="0" width="88" height="195" rx="10" fill="#ffffff" stroke="#c4cbde" stroke-width="2"/>
      <text x="138" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#232742">D</text>

      <!-- Active White Key (E) -->
      <rect x="188" y="0" width="88" height="195" rx="10" fill="#e8faff" stroke="#00f2fe" stroke-width="3"/>
      <text x="232" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#0088cc">E</text>
      <circle cx="232" cy="140" r="14" fill="#00f2fe"/>
      <text x="232" y="145" text-anchor="middle" font-size="12" fill="#fff">♪</text>

      <rect x="282" y="0" width="88" height="195" rx="10" fill="#ffffff" stroke="#c4cbde" stroke-width="2"/>
      <text x="326" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#232742">F</text>

      <rect x="376" y="0" width="88" height="195" rx="10" fill="#ffffff" stroke="#c4cbde" stroke-width="2"/>
      <text x="420" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#232742">G</text>

      <rect x="470" y="0" width="88" height="195" rx="10" fill="#ffffff" stroke="#c4cbde" stroke-width="2"/>
      <text x="514" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#232742">A</text>

      <rect x="564" y="0" width="88" height="195" rx="10" fill="#ffffff" stroke="#c4cbde" stroke-width="2"/>
      <text x="608" y="175" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#232742">B</text>

      <!-- Black Keys -->
      <rect x="62" y="0" width="52" height="120" rx="7" fill="#1b1d30"/>
      <rect x="156" y="0" width="52" height="120" rx="7" fill="#1b1d30"/>
      <rect x="344" y="0" width="52" height="120" rx="7" fill="#1b1d30"/>
      <rect x="438" y="0" width="52" height="120" rx="7" fill="#1b1d30"/>
      <rect x="532" y="0" width="52" height="120" rx="7" fill="#1b1d30"/>
    </g>
  </g>

  <!-- Parent & Teacher IEP Analytics Card -->
  <g transform="translate(40, 730)">
    <rect width="720" height="280" rx="24" fill="url(#cardGrad)" stroke="#3b4175" stroke-width="1.5"/>
    <text x="35" y="48" font-family="sans-serif" font-size="14" font-weight="800" fill="#43e97b" letter-spacing="2">PARENT &amp; EDUCATOR DASHBOARD</text>
    <text x="35" y="85" font-family="sans-serif" font-size="26" font-weight="800" fill="#ffffff">IEP Progress &amp; Sensory Metrics</text>

    <!-- Stat 1 -->
    <g transform="translate(35, 115)">
      <rect width="205" height="130" rx="18" fill="#1f2347"/>
      <text x="24" y="42" font-family="sans-serif" font-size="13" fill="#9da7cf" font-weight="600">Pitch Accuracy</text>
      <text x="24" y="85" font-family="sans-serif" font-size="36" font-weight="800" fill="#00f2fe">94%</text>
      <text x="24" y="112" font-family="sans-serif" font-size="12" fill="#43e97b" font-weight="700">▲ +12% this week</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(258, 115)">
      <rect width="205" height="130" rx="18" fill="#1f2347"/>
      <text x="24" y="42" font-family="sans-serif" font-size="13" fill="#9da7cf" font-weight="600">Rhythm Consistency</text>
      <text x="24" y="85" font-family="sans-serif" font-size="36" font-weight="800" fill="#ffd166">88%</text>
      <text x="24" y="112" font-family="sans-serif" font-size="12" fill="#43e97b" font-weight="700">▲ Steady tempo</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(480, 115)">
      <rect width="205" height="130" rx="18" fill="#1f2347"/>
      <text x="24" y="42" font-family="sans-serif" font-size="13" fill="#9da7cf" font-weight="600">Focus Session Time</text>
      <text x="24" y="85" font-family="sans-serif" font-size="36" font-weight="800" fill="#ff7eb3">22m</text>
      <text x="24" y="112" font-family="sans-serif" font-size="12" fill="#9da7cf" font-weight="600">Optimal sensory zone</text>
    </g>
  </g>
</svg>
