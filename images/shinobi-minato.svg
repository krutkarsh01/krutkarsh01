<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Minato Namikaze (Fourth Hokage · Yellow Flash) Stylized Silhouette -->
  <defs>
    <linearGradient id="minatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Spiky Hairstyle (Minato's signature spikes) -->
  <path d="M 100 40 
           C 85 20, 65 30, 60 48
           C 50 42, 38 52, 42 66
           C 30 70, 32 88, 48 92
           C 40 100, 48 115, 62 110
           C 66 118, 78 122, 88 120
           L 92 135 L 108 135 L 112 120
           C 122 122, 134 118, 138 110
           C 152 115, 160 100, 152 92
           C 168 88, 170 70, 158 66
           C 162 52, 150 42, 140 48
           C 135 30, 115 20, 100 40 Z" 
        fill="url(#minatoGrad)" filter="url(#yellowGlow)"/>

  <!-- Hitai-ate Headband Metal Plate -->
  <path d="M 68 82 Q 100 76 132 82 L 130 96 Q 100 90 70 96 Z" fill="#94a3b8" opacity="0.6"/>
  <circle cx="100" cy="88" r="4" fill="#fbbf24" filter="url(#yellowGlow)"/>

  <!-- Hokage Cloak Collars & Flapping Flames (四代目火影) -->
  <path d="M 70 130 
           L 40 170 L 25 240 L 45 230 L 60 280 L 80 220 L 100 290 L 120 220 L 140 280 L 155 230 L 175 240 L 160 170 L 130 130
           C 120 145, 80 145, 70 130 Z" 
        fill="url(#minatoGrad)" opacity="0.35" filter="url(#yellowGlow)"/>

  <!-- Three-Pronged Hiraishin Kunai in Hand -->
  <g transform="translate(145, 140) rotate(25)" filter="url(#yellowGlow)">
    <path d="M 0 -30 L 8 -10 L 18 -5 L 8 0 L 4 25 L 0 35 L -4 25 L -8 0 L -18 -5 L -8 -10 Z" fill="#fef08a" opacity="0.8"/>
    <circle cx="0" cy="40" r="5" fill="none" stroke="#fef08a" stroke-width="2"/>
    <text x="0" y="8" font-size="6" fill="#000" font-weight="900" text-anchor="middle">忍愛</text>
  </g>

  <!-- Teleportation Lightning Sparks -->
  <path d="M 30 100 L 45 120 L 35 130 L 55 155" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.75" filter="url(#yellowGlow)"/>
  <path d="M 170 90 L 155 115 L 168 125 L 150 160" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.75" filter="url(#yellowGlow)"/>
</svg>

