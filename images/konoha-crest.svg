<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Kurama Flame Chakra Gradient -->
    <linearGradient id="kuramaFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="50%" stop-color="#ff5e1a"/>
      <stop offset="100%" stop-color="#d93800"/>
    </linearGradient>

    <!-- Metallic Hitai-ate Titanium Gradient -->
    <linearGradient id="hitaiMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldChakra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="chakraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hitai-ate Shield / Seal -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#hitaiMetal)" stroke="url(#goldChakra)" stroke-width="1.5"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="10.5" fill="none" stroke="#475569" stroke-width="0.8" opacity="0.6"/>

  <!-- Corner Rivets -->
  <circle cx="6" cy="6" r="1.2" fill="#94a3b8"/>
  <circle cx="42" cy="6" r="1.2" fill="#94a3b8"/>
  <circle cx="6" cy="42" r="1.2" fill="#94a3b8"/>
  <circle cx="42" cy="42" r="1.2" fill="#94a3b8"/>

  <!-- Glowing Chakra Background Halo -->
  <circle cx="24" cy="24" r="15" fill="url(#kuramaFlame)" opacity="0.18" filter="url(#chakraGlow)"/>

  <!-- Minato's Three-Pronged Hiraishin Kunai (Back Layer) -->
  <g opacity="0.45">
    <!-- Center Blade -->
    <path d="M24 6 L26.5 15 L24 23 L21.5 15 Z" fill="#94a3b8"/>
    <!-- Left Prong -->
    <path d="M21.5 15 L16 17 L21 19 Z" fill="#64748b"/>
    <!-- Right Prong -->
    <path d="M26.5 15 L32 17 L27 19 Z" fill="#64748b"/>
    <!-- Handle & Ring -->
    <line x1="24" y1="23" x2="24" y2="38" stroke="#64748b" stroke-width="1.8"/>
    <circle cx="24" cy="40" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Iconic Konoha Leaf Swirl (木ノ葉のマーク) - Centered & Crisp -->
  <g filter="url(#chakraGlow)">
    <!-- Leaf Apex / Tip pointing up-right at 45 deg -->
    <path d="M27.5 12.5 C29.5 10 33.5 10.5 35 14 C33 14.5 30.5 14.5 28.5 15.5 Z" fill="url(#goldChakra)"/>
    
    <!-- Sacred Spiral Curve -->
    <path d="M 24 16
             C 29.5 16, 33 20, 33 25
             C 33 30.5, 28.5 34, 23 34
             C 17.5 34, 14 29.5, 14 24
             C 14 18.5, 18.5 15, 23.5 15
             C 27.5 15, 30 18, 30 21.5
             C 30 24.5, 27.5 27, 24.5 27
             C 22 27, 20.5 25.5, 20.5 23.5
             C 20.5 22, 21.8 21, 23 21
             C 24 21, 24.8 21.6, 24.8 22.4"
          fill="none"
          stroke="url(#kuramaFlame)"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing Chakra Core Spark -->
  <circle cx="24" cy="22.5" r="1.5" fill="#ffffff" filter="url(#chakraGlow)"/>
</svg>

