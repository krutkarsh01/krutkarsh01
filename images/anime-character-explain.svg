<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220" fill="none">
  <!-- Anime Strategist - Explaining & Presenting Pose -->
  <defs>
    <filter id="explain-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#111111" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ground Ripple -->
  <ellipse cx="78" cy="210" rx="36" ry="6" fill="#111111" fill-opacity="0.08"/>

  <!-- Body Group -->
  <g filter="url(#explain-shadow)">
    <!-- Legs & Shoes -->
    <path d="M66 136 L64 190 L58 192 L56 206 L72 206 L71 190 L74 136 Z" fill="#111111"/>
    <path d="M86 136 L89 190 L87 192 L86 206 L102 206 L100 190 L94 136 Z" fill="#18181B"/>
    <path d="M54 202 C54 200 58 198 64 198 L73 198 L76 206 L53 206 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <path d="M84 202 C84 200 88 198 94 198 L103 198 L106 206 L83 206 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <path d="M56 205 L74 205" stroke="#DDE4C3" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 205 L104 205" stroke="#DDE4C3" stroke-width="3" stroke-linecap="round"/>

    <!-- Torso: Modern Tech Jacket -->
    <path d="M70 82 L88 82 L86 138 L72 138 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <path d="M50 86 C48 110 50 132 52 138 L72 138 L70 84 C60 82 54 84 50 86 Z" fill="#111111"/>
    <path d="M106 86 C108 110 106 132 104 138 L84 138 L86 84 C96 82 102 84 106 86 Z" fill="#18181B"/>

    <!-- Sage Scarf -->
    <path d="M60 76 C68 82 88 82 96 76 C100 84 94 92 86 94 C78 96 66 94 60 76 Z" fill="#DDE4C3" stroke="#111111" stroke-width="2"/>
    <path d="M80 88 L84 116 L72 114 L74 89 Z" fill="#EBF1D9" stroke="#111111" stroke-width="1.5"/>

    <!-- Left Arm (Hand on hip / confident) -->
    <path d="M50 88 C40 98 36 112 36 122 L44 124 C46 116 48 106 58 96 Z" fill="#111111"/>
    <circle cx="36" cy="122" r="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>

    <!-- Right Arm (Pointing / Presenting to the side) -->
    <path d="M106 88 C120 92 136 94 148 90 L146 82 C134 84 120 82 104 78 Z" fill="#18181B"/>
    <!-- Pointing Hand -->
    <circle cx="150" cy="86" r="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>
    <path d="M152 86 L158 84" stroke="#FED7AA" stroke-width="3" stroke-linecap="round"/>
    <!-- Explaining Sparkles -->
    <path d="M150 72 L152 76 L156 78 L152 80 L150 84 L148 80 L144 78 L148 76 Z" fill="#DDE4C3"/>
    <path d="M138 68 L139 71 L142 72 L139 73 L138 76 L137 73 L134 72 L137 71 Z" fill="#111111"/>

    <!-- Neck & Head -->
    <rect x="72" y="68" width="12" height="14" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>
    <path d="M64 50 C64 68 72 76 78 76 C84 76 92 68 92 50 C92 40 86 38 78 38 C70 38 64 40 64 50 Z" fill="#FED7AA" stroke="#111111" stroke-width="2"/>
    <ellipse cx="63" cy="54" rx="3" ry="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>
    <ellipse cx="93" cy="54" rx="3" ry="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>

    <!-- Friendly Explaining Eyes -->
    <ellipse cx="71" cy="53" rx="3.5" ry="4.5" fill="#111111"/>
    <circle cx="72" cy="51.5" r="1.5" fill="#FFFFFF"/>
    <ellipse cx="85" cy="53" rx="3.5" ry="4.5" fill="#111111"/>
    <circle cx="86" cy="51.5" r="1.5" fill="#FFFFFF"/>
    <!-- Talking Open Mouth -->
    <path d="M74 63 Q78 68 82 63 Z" fill="#111111"/>
    <path d="M75 64 Q78 67 81 64" fill="#FCA5A5"/>

    <!-- Hair -->
    <path d="M62 48 C58 38 62 24 74 20 C84 16 96 22 98 32 C102 40 100 48 96 52 C94 42 90 34 84 32 C80 30 74 32 72 36 C68 42 66 46 62 48 Z" fill="#111111"/>
    <path d="M66 36 L70 48 L74 38 L78 50 L82 38 L86 48 L90 38" stroke="#111111" stroke-width="2.5" fill="#111111" stroke-linejoin="round"/>
    <path d="M72 24 Q80 22 88 26" stroke="#DDE4C3" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
