<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220" fill="none">
  <!-- Anime Strategist - Airborne Jump Pose -->
  <defs>
    <filter id="jump-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="8" stdDeviation="6" flood-color="#111111" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="sage-jump-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF1D9"/>
      <stop offset="100%" stop-color="#DDE4C3"/>
    </linearGradient>
  </defs>

  <!-- Speed / Wind Lines -->
  <path d="M40 180 Q45 200 48 215" stroke="#DDE4C3" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <path d="M120 180 Q115 200 112 215" stroke="#DDE4C3" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/>
  <path d="M80 195 L80 220" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 4" stroke-opacity="0.3"/>

  <!-- Body Group in Flight Tilt -->
  <g filter="url(#jump-shadow)" transform="rotate(-6 80 110)">
    <!-- Flowing Sage Scarf Tails in Wind -->
    <path d="M96 74 C115 65 135 68 152 58 C138 72 120 80 94 84 Z" fill="url(#sage-jump-grad)" stroke="#111111" stroke-width="1.5"/>
    <path d="M92 78 C110 75 128 80 144 74 C132 86 112 92 88 88 Z" fill="#DDE4C3" stroke="#111111" stroke-width="1.5"/>

    <!-- Bent Legs for Jump Momentum -->
    <!-- Left Leg (tucked back) -->
    <path d="M68 125 L50 155 L42 152 L36 172 L50 174 L58 155 L74 130 Z" fill="#111111"/>
    <!-- Right Leg (bent forward) -->
    <path d="M84 125 L92 160 L104 158 L114 176 L102 182 L82 160 L80 128 Z" fill="#18181B"/>
    <!-- Tucked Sneakers -->
    <path d="M34 168 C34 164 38 162 44 164 L50 172 L36 174 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <path d="M102 178 C104 174 108 172 114 174 L116 182 L100 184 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <circle cx="43" cy="169" r="2" fill="#DDE4C3"/>
    <circle cx="109" cy="179" r="2" fill="#DDE4C3"/>

    <!-- Torso: Aerodynamic Tech Jacket -->
    <path d="M60 76 L96 76 L94 130 L64 128 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <path d="M50 78 C46 102 50 122 56 128 L72 128 L70 78 Z" fill="#111111"/>
    <path d="M106 78 C110 102 106 122 100 128 L84 128 L86 78 Z" fill="#18181B"/>

    <!-- Left Arm (trailing back) -->
    <path d="M50 82 C38 90 28 104 22 118 L30 122 C36 110 44 98 54 88 Z" fill="#111111"/>
    <circle cx="23" cy="122" r="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>

    <!-- Right Arm (reaching upward/forward) -->
    <path d="M104 82 C116 72 126 56 132 40 L124 36 C118 52 110 66 98 76 Z" fill="#18181B"/>
    <circle cx="132" cy="38" r="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>
    <!-- Sparkle on hand -->
    <path d="M136 30 L138 34 L142 36 L138 38 L136 42 L134 38 L130 36 L134 34 Z" fill="#DDE4C3"/>

    <!-- Neck & Head (tilted forward) -->
    <rect x="73" y="62" width="14" height="14" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>
    <path d="M66 44 C66 62 74 70 80 70 C86 70 94 62 94 44 C94 34 88 32 80 32 C72 32 66 34 66 44 Z" fill="#FED7AA" stroke="#111111" stroke-width="2"/>
    <ellipse cx="65" cy="48" rx="3" ry="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>
    <ellipse cx="95" cy="48" rx="3" ry="5" fill="#FED7AA" stroke="#111111" stroke-width="1.5"/>

    <!-- Eyes (Focused upward) -->
    <ellipse cx="73" cy="46" rx="3.5" ry="4" fill="#111111"/>
    <circle cx="74" cy="44.5" r="1.5" fill="#FFFFFF"/>
    <ellipse cx="87" cy="46" rx="3.5" ry="4" fill="#111111"/>
    <circle cx="88" cy="44.5" r="1.5" fill="#FFFFFF"/>
    <!-- Confident Smile -->
    <path d="M75 58 Q80 63 85 58" stroke="#111111" stroke-width="2" stroke-linecap="round"/>

    <!-- Hair (Blowing back in wind) -->
    <path d="M62 42 C56 30 62 14 74 12 C88 10 102 18 108 30 C102 24 94 22 86 24 C76 26 70 32 66 40 Z" fill="#111111"/>
    <path d="M68 30 L74 42 L78 32 L82 44 L86 32 L90 42 L94 30" stroke="#111111" stroke-width="2.5" fill="#111111" stroke-linejoin="round"/>
    <path d="M72 16 Q80 14 88 18" stroke="#DDE4C3" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
