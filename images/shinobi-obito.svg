<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Obito Uchiha (Kamui Space-Time Architect) Stylized Silhouette -->
  <defs>
    <linearGradient id="obitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </linearGradient>
    <filter id="kamuiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Spiky Dark Hair -->
  <path d="M 100 45 
           C 85 30, 70 38, 65 52
           C 52 48, 48 62, 54 75
           C 42 80, 45 98, 58 102
           C 52 112, 62 120, 74 120
           L 85 130 L 115 130 L 126 120
           C 138 120, 148 112, 142 102
           C 155 98, 158 80, 146 75
           C 152 62, 148 48, 135 52
           C 130 38, 115 30, 100 45 Z" 
        fill="url(#obitoGrad)" filter="url(#kamuiGlow)"/>

  <!-- Iconic Orange Spiral Mask (Kamui Center on Right Eye) -->
  <g transform="translate(100, 95)" filter="url(#kamuiGlow)">
    <ellipse cx="0" cy="0" rx="35" ry="40" fill="#ea580c" opacity="0.65" stroke="#9a3412" stroke-width="2"/>
    <!-- Spiral Grooves Converging on Right Eye Hole -->
    <path d="M 14 -4 C 18 10, -5 25, -25 10 C -35 -5, -15 -28, 5 -25 C 20 -22, 28 -5, 25 12" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 -4 C 10 -15, -12 -15, -20 -2 C -25 12, -8 20, 8 16" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
    <!-- The Single Eye Slit (Glowing Red Sharingan) -->
    <circle cx="14" cy="-4" r="5" fill="#000000"/>
    <circle cx="14" cy="-4" r="3.5" fill="#ef4444"/>
    <circle cx="14" cy="-4" r="1.5" fill="#000000"/>
    <circle cx="15" cy="-5" r="0.6" fill="#ffffff"/>
  </g>

  <!-- High-Collar Uchiha Robe with White Crest -->
  <path d="M 65 140 L 40 160 L 30 260 L 70 250 L 100 270 L 130 250 L 170 260 L 160 160 L 135 140 L 115 155 L 85 155 Z" fill="#1e1b4b" opacity="0.6"/>
  <!-- High Collar Flares -->
  <path d="M 65 140 L 50 115 L 75 130 Z" fill="#312e81" opacity="0.8"/>
  <path d="M 135 140 L 150 115 L 125 130 Z" fill="#312e81" opacity="0.8"/>

  <!-- Kamui Spacetime Distortion Vortex Rings -->
  <g transform="translate(114, 91)" opacity="0.75" filter="url(#kamuiGlow)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#fda4af" stroke-width="1" stroke-dasharray="12 10"/>
  </g>
</svg>

