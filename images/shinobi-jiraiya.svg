<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Jiraiya (The Gallant Toad Sage) Stylized Silhouette -->
  <defs>
    <linearGradient id="jiraiyaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0"/>
    </linearGradient>
    <filter id="sageGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Giant Spiky Wild White Mane flowing past shoulders down the back -->
  <path d="M 100 35 
           C 80 15, 50 25, 45 45
           C 30 40, 20 60, 25 80
           C 15 90, 10 115, 20 135
           C 12 150, 15 175, 25 200
           C 32 230, 45 250, 60 260
           L 70 230 L 80 200 L 90 145 L 110 145 L 120 200 L 130 230 L 140 260
           C 155 250, 168 230, 175 200
           C 185 175, 188 150, 180 135
           C 190 115, 185 90, 175 80
           C 180 60, 170 40, 155 45
           C 150 25, 120 15, 100 35 Z" 
        fill="url(#jiraiyaGrad)" filter="url(#sageGlow)"/>

  <!-- Horned "Oil" (油) Mt. Myōboku Headband -->
  <path d="M 65 72 L 135 72 L 132 94 L 68 94 Z" fill="#78716c" opacity="0.8"/>
  <rect x="75" y="70" width="50" height="22" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <!-- Two Small Horn Studs on Plate -->
  <path d="M 72 66 L 77 74 L 69 74 Z" fill="#94a3b8"/>
  <path d="M 128 66 L 131 74 L 123 74 Z" fill="#94a3b8"/>
  <!-- "油" (Oil) Kanji Stamp -->
  <text x="100" y="87" font-size="14" font-weight="900" fill="#991b1b" font-family="serif" text-anchor="middle">油</text>

  <!-- Crimson Facial Tear Lines (Eye Lines running all the way down) -->
  <line x1="82" y1="98" x2="82" y2="135" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <line x1="118" y1="98" x2="118" y2="135" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>

  <!-- Giant Sacred Summoning Scroll Strapped across back -->
  <g transform="translate(100, 190) rotate(18)" filter="url(#sageGlow)">
    <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#d97706" opacity="0.85" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="-68" cy="0" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <circle cx="68" cy="0" r="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <!-- Scroll Tie Bands -->
    <rect x="-35" y="-12" width="6" height="24" fill="#991b1b"/>
    <rect x="29" y="-12" width="6" height="24" fill="#991b1b"/>
  </g>

  <!-- Green Shinobi Haori & Red Kimono Vest -->
  <path d="M 75 140 L 50 180 L 45 270 L 80 250 L 100 270 L 120 250 L 155 270 L 150 180 L 125 140 Z" fill="#065f46" opacity="0.45"/>
  <path d="M 85 140 L 70 180 L 80 240 L 100 245 L 120 240 L 130 180 L 115 140 Z" fill="#991b1b" opacity="0.5"/>
</svg>

