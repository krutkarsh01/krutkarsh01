<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Kakashi Hatake (Copy Ninja · Sixth Hokage) Stylized Silhouette -->
  <defs>
    <linearGradient id="kakashiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="lightningGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Swept-back Spiky Silver Hair tilted to the left -->
  <path d="M 120 40 
           C 140 25, 170 35, 165 55
           C 175 60, 180 75, 168 85
           C 178 95, 172 110, 155 112
           C 140 120, 130 115, 120 125
           L 115 135 L 95 135 L 90 125
           C 80 125, 65 115, 58 100
           C 45 95, 42 75, 55 65
           C 48 50, 60 35, 78 40
           C 85 20, 105 18, 120 40 Z" 
        fill="url(#kakashiGrad)" filter="url(#lightningGlow)"/>

  <!-- Tilted Hitai-ate Headband covering left eye -->
  <path d="M 60 85 L 140 70 L 142 85 L 62 100 Z" fill="#475569" opacity="0.75"/>
  <rect x="85" y="73" width="30" height="12" rx="2" transform="rotate(-11 100 79)" fill="#94a3b8" stroke="#cbd5e1" stroke-width="0.8"/>

  <!-- Glowing Crimson Sharingan Eye Peeking Through Slit -->
  <circle cx="82" cy="102" r="5" fill="#ef4444" filter="url(#lightningGlow)"/>
  <circle cx="82" cy="102" r="2" fill="#000000"/>
  <circle cx="83.5" cy="100.5" r="0.8" fill="#ffffff"/>

  <!-- Ninja Mask covering lower face -->
  <path d="M 70 115 Q 100 130 130 115 L 125 155 Q 100 170 75 155 Z" fill="#1e293b" opacity="0.6"/>

  <!-- Chidori / Lightning Blade (Raikiri) in Right Hand -->
  <g transform="translate(145, 180)" filter="url(#lightningGlow)">
    <!-- Lightning Core -->
    <circle cx="0" cy="0" r="16" fill="#e0f2fe" opacity="0.85"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <!-- Crackling Lightning Branches -->
    <path d="M 0 0 L -18 -25 L -8 -35 L -28 -50" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 0 L 25 -15 L 35 -30 L 45 -20" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L -20 20 L -35 15 L -45 35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L 20 25 L 15 45 L 35 55" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 0 0 L -5 35 L 5 50" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>

