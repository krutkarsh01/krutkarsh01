<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none">
  <!-- Naruto Uzumaki (Seventh Hokage · Sage Mode) Stylized Silhouette -->
  <defs>
    <linearGradient id="narutoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff5e1a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rasenganGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Spiky Blonde Hair -->
  <path d="M 100 45 
           C 90 25, 75 30, 70 48
           C 60 40, 50 50, 52 65
           C 40 68, 42 85, 56 90
           C 48 98, 55 110, 68 110
           L 82 125 L 118 125 L 132 110
           C 145 110, 152 98, 144 90
           C 158 85, 160 68, 148 65
           C 150 50, 140 40, 130 48
           C 125 30, 110 25, 100 45 Z" 
        fill="url(#narutoGrad)" filter="url(#flameGlow)"/>

  <!-- Hitai-ate Headband with Leaf Emblem -->
  <path d="M 66 82 Q 100 78 134 82 L 132 96 Q 100 92 68 96 Z" fill="#334155" opacity="0.8"/>
  <rect x="80" y="82" width="40" height="14" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="100" cy="89" r="3" fill="#ff5e1a"/>

  <!-- Sage Mode Eyes (Horizontal Bar Pupils + Orange Eyelid Pigmentation) -->
  <path d="M 76 102 Q 88 98 94 104 Q 88 108 76 102 Z" fill="#ea580c" opacity="0.85"/>
  <circle cx="86" cy="103" r="3.5" fill="#f59e0b"/>
  <rect x="83.5" y="102" width="5" height="2" rx="1" fill="#18181b"/>

  <path d="M 124 102 Q 112 98 106 104 Q 112 108 124 102 Z" fill="#ea580c" opacity="0.85"/>
  <circle cx="114" cy="103" r="3.5" fill="#f59e0b"/>
  <rect x="111.5" y="102" width="5" height="2" rx="1" fill="#18181b"/>

  <!-- Three Whiskers Marks on Cheeks -->
  <line x1="68" y1="112" x2="80" y2="114" stroke="#ff5e1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="116" x2="78" y2="118" stroke="#ff5e1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="70" y1="120" x2="82" y2="122" stroke="#ff5e1a" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="132" y1="112" x2="120" y2="114" stroke="#ff5e1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="134" y1="116" x2="122" y2="118" stroke="#ff5e1a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="120" x2="118" y2="122" stroke="#ff5e1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sage Mode Red / Black Cloak -->
  <path d="M 72 135 L 45 180 L 35 270 L 65 260 L 85 285 L 100 240 L 115 285 L 135 260 L 165 270 L 155 180 L 128 135 Z" fill="#991b1b" opacity="0.45"/>

  <!-- Rasengan Swirling Sphere in Hand -->
  <g transform="translate(60, 190)" filter="url(#flameGlow)">
    <circle cx="0" cy="0" r="22" fill="url(#rasenganGrad)" opacity="0.9"/>
    <!-- Swirl Rings -->
    <path d="M -16 0 A 16 16 0 0 1 16 0 A 14 14 0 0 1 -14 0" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 0 -16 A 16 16 0 0 1 0 16 A 14 14 0 0 1 0 -14" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>

